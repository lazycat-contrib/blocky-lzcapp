# blocky 默认配置 —— 本包首次启动时自动复制到 /lzcapp/var/config/config.yml，
# 之后请直接编辑该文件并通过 Web UI 触发 Reload（或重启应用）生效。
upstreams:
  init:
    strategy: fast
  groups:
    # 默认上游 DNS：阿里公共 DNS + DNSPod + Google
    default:
      - 223.5.5.5
      - 119.29.29.29
      - https://dns.alidns.com/dns-query
      - 8.8.8.8

# Web UI / API 端口（平台入口会转发到该端口）
httpPort: 4000
# DNS 监听端口
port: 53

logLevel: info

# 广告拦截默认未启用：需要时取消下面注释（列表会在启动时下载）
# blocking:
